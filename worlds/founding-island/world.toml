# The Founding Island: the one world this build ships (SPEC section 6).
# All coordinates are absolute grid coordinates. Kinds and behaviors come from the engine vocabulary.
# Seeds get ids res_0, res_1, ... in this order: each seed_group in file order (each group in the order of its
# "at" list), then each seed_object. A mystery takes its id slot after the first `after_seed_group` groups.
schema_version = 1

[world]
name = "The Founding Island"
description = "Three territories, one empire, a mystery in the hills."
grid_size = 24
max_villagers = 8

[[territory]]
id = "forest"
name = "Greenwood Forest"
color = "#22c55e"
offset = { x = 0, y = 0 }
size = 14
description = "Dense woodland. Trees stand thick here, and berry bushes grow in the shade."

[[territory]]
id = "valley"
name = "Golden Valley"
color = "#eab308"
offset = { x = 17, y = 0 }
size = 7
description = "Open plains of tall grass. Gold veins lie exposed in the earth."

[[territory]]
id = "hills"
name = "Stone Hills"
color = "#94a3b8"
offset = { x = 8, y = 17 }
size = 6
description = "Rocky highlands. Stone quarries are cut into the slopes."

[[road]]
from = "forest"
to = "valley"
cells = [{ x = 14, y = 6 }, { x = 15, y = 6 }, { x = 16, y = 6 }, { x = 17, y = 6 }]

[[road]]
from = "valley"
to = "hills"
cells = [{ x = 16, y = 7 }, { x = 16, y = 8 }, { x = 16, y = 9 }, { x = 16, y = 10 }, { x = 16, y = 11 }, { x = 16, y = 12 }, { x = 16, y = 13 }, { x = 16, y = 14 }, { x = 16, y = 15 }, { x = 16, y = 16 }, { x = 15, y = 16 }, { x = 14, y = 16 }, { x = 13, y = 16 }]

[[road]]
from = "hills"
to = "forest"
cells = [{ x = 11, y = 14 }, { x = 10, y = 14 }, { x = 10, y = 15 }, { x = 10, y = 16 }, { x = 10, y = 17 }]

[[seed_group]]
